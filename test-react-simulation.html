<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulación React - Debug Eliminar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: #0f0f0f;
            color: white;
        }
        .campaign-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin: 10px 0;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn {
            padding: 8px 12px;
            border: 1px solid #555;
            border-radius: 6px;
            background: transparent;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-delete {
            color: #ef4444;
            border-color: #555;
        }
        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.1);
        }
        .log {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            white-space: pre-wrap;
            font-family: monospace;
            max-height: 400px;
            overflow-y: auto;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .info { color: #3b82f6; }
        .warning { color: #f59e0b; }
        .status {
            padding: 10px;
            border-radius: 6px;
            margin: 10px 0;
            font-weight: bold;
        }
        .status.success { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .status.error { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
        .status.info { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
    </style>
</head>
<body>
    <h1>🔍 Simulación Exacta del Componente React</h1>
    
    <div class="status info" id="status">Inicializando simulación...</div>
    
    <div>
        <h2>📋 Estado del Usuario Simulado</h2>
        <div id="user-info"></div>
    </div>
    
    <div>
        <h2>📋 Campañas Simuladas</h2>
        <div id="campaigns-container"></div>
    </div>
    
    <div class="log" id="log"></div>
    
    <script>
        // Simulación del estado React
        let user = {
            email: 'selamu.garcia@gmail.com',
            uid: 'test-user-123'
        };
        
        let campaigns = [];
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logElement = document.getElementById('log');
            const className = type === 'success' ? 'success' : type === 'error' ? 'error' : type === 'warning' ? 'warning' : 'info';
            logElement.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            logElement.scrollTop = logElement.scrollHeight;
            console.log(`[${timestamp}] ${message}`);
        }
        
        function updateStatus(message, type = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.className = `status ${type}`;
            statusEl.textContent = message;
        }
        
        function updateUserInfo() {
            const userInfoEl = document.getElementById('user-info');
            userInfoEl.innerHTML = `
                <p><strong>Email:</strong> ${user?.email || 'No disponible'}</p>
                <p><strong>UID:</strong> ${user?.uid || 'No disponible'}</p>
                <p><strong>Estado:</strong> ${user ? 'Autenticado' : 'No autenticado'}</p>
            `;
        }
        
        // Simulación exacta de la función deleteCampaign del componente React
        const deleteCampaign = async (campaignId) => {
            log('🔥 INICIO deleteCampaign - ID: ' + campaignId, 'info');
            log('🔥 User object: ' + JSON.stringify(user), 'info');
            log('🔥 User email: ' + (user?.email || 'undefined'), 'info');
            log('🔥 Campaigns before delete: ' + campaigns.length, 'info');
            
            if (!user?.email) {
                log('❌ No user email found, returning', 'error');
                alert('Error: No se encontró el email del usuario. Por favor, inicia sesión nuevamente.');
                return;
            }
            
            if (!confirm('¿Estás seguro de que quieres eliminar esta campaña? Esta acción no se puede deshacer.')) {
                log('❌ User cancelled deletion', 'warning');
                return;
            }
            
            try {
                log('🚀 Sending DELETE request...', 'info');
                log('🚀 Request headers: ' + JSON.stringify({
                    'Content-Type': 'application/json',
                    'x-user-email': user.email
                }), 'info');
                log('🚀 Request body: ' + JSON.stringify({ campaignId }), 'info');
                
                const response = await fetch('/api/campaigns/automated', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-user-email': user.email
                    },
                    body: JSON.stringify({ campaignId })
                });
                
                log('📡 Response status: ' + response.status, 'info');
                log('📡 Response ok: ' + response.ok, 'info');
                
                if (response.ok) {
                    const result = await response.json();
                    log('✅ Delete successful: ' + JSON.stringify(result), 'success');
                    
                    // Actualizar estado local inmediatamente
                    log('🔄 Updating local state...', 'info');
                    campaigns = campaigns.filter(c => c.id !== campaignId);
                    log('🔄 Local state updated, campaigns count: ' + campaigns.length, 'success');
                    
                    // Recargar campañas
                    log('🔄 Calling loadCampaigns...', 'info');
                    await loadCampaigns();
                    
                    alert('Campaña eliminada exitosamente');
                    updateStatus('Campaña eliminada exitosamente', 'success');
                } else {
                    const errorData = await response.json();
                    log('❌ Delete failed: ' + JSON.stringify(errorData), 'error');
                    alert(`Error al eliminar la campaña: ${errorData.error || 'Error desconocido'}`);
                    updateStatus('Error al eliminar la campaña', 'error');
                }
            } catch (error) {
                log('💥 Error deleting campaign: ' + error.message, 'error');
                alert('Error al eliminar la campaña: ' + error.message);
                updateStatus('Error en la solicitud', 'error');
            }
            
            log('🏁 FIN deleteCampaign', 'info');
        };
        
        async function loadCampaigns() {
            try {
                log('📥 Loading campaigns...', 'info');
                
                const response = await fetch('/api/campaigns/automated', {
                    headers: {
                        'x-user-email': user.email
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                campaigns = data.campaigns || [];
                
                log('✅ Campaigns loaded: ' + campaigns.length, 'success');
                renderCampaigns();
                
            } catch (error) {
                log('❌ Error loading campaigns: ' + error.message, 'error');
            }
        }
        
        function renderCampaigns() {
            const container = document.getElementById('campaigns-container');
            
            if (campaigns.length === 0) {
                container.innerHTML = '<p style="color: #f59e0b;">No hay campañas disponibles</p>';
                return;
            }
            
            container.innerHTML = '';
            
            campaigns.forEach(campaign => {
                const campaignDiv = document.createElement('div');
                campaignDiv.className = 'campaign-card';
                campaignDiv.innerHTML = `
                    <h3>${campaign.name}</h3>
                    <p style="color: #9ca3af;">ID: ${campaign.id}</p>
                    <p style="color: #9ca3af;">Email: ${campaign.userEmail}</p>
                    <div class="button-group">
                        <button 
                            class="btn btn-delete" 
                            onclick="(() => deleteCampaign('${campaign.id}'))()"
                            title="Eliminar campaña"
                        >
                            ❌ Eliminar
                        </button>
                    </div>
                `;
                container.appendChild(campaignDiv);
            });
        }
        
        // Inicialización
        document.addEventListener('DOMContentLoaded', function() {
            log('🚀 Iniciando simulación React', 'info');
            updateUserInfo();
            updateStatus('Cargando campañas...', 'info');
            loadCampaigns();
        });
        
        // Capturar todos los clicks para debug
        document.addEventListener('click', function(e) {
            if (e.target.closest('.btn-delete')) {
                log('🎯 Click detectado en botón eliminar', 'info');
            }
        });
    </script>
</body>
</html>
