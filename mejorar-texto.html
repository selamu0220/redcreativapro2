<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mejorar Texto con IA</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        textarea { width: 100%; height: 150px; margin: 10px 0; padding: 10px; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #resultado { margin-top: 20px; padding: 15px; background: #f0f0f0; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Mejorar Texto con IA</h1>
    <textarea id="input" placeholder="Escribe o pega tu texto aquí..."></textarea>
    <button onclick="mejorarTexto()">Mejorar Texto</button>
    <div id="resultado"></div>

    <script>
        // ⚠️ IMPORTANTE: Reemplaza con tu API key de OpenRouter
        const API_KEY = 'TU_API_KEY_AQUI';
        const MODEL = 'openai/gpt-3.5-turbo';

        async function mejorarTexto() {
            const texto = document.getElementById('input').value;
            const resultado = document.getElementById('resultado');

            if (!API_KEY || API_KEY === 'TU_API_KEY_AQUI') {
                resultado.innerHTML = '⚠️ Necesitas poner tu API key de OpenRouter';
                return;
            }

            resultado.innerHTML = 'Mejorando...';

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json',
                        'HTTP-Referer': 'https://ejemplo.com',
                        'X-Title': 'Mejorar Texto'
                    },
                    body: JSON.stringify({
                        model: MODEL,
                        messages: [{
                            role: 'user',
                            content: `Mejora este texto, corrige errores, hazlo más claro y profesional: "${texto}"`
                        }]
                    })
                });

                const data = await response.json();
                resultado.innerHTML = data.choices[0].message.content;
            } catch (error) {
                resultado.innerHTML = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
