# GitLab CI/CD Configuration for Mobile Build
# This ensures the correct build process for Capacitor/Fastlane

stages:
  - build
  - deploy

variables:
  NODE_VERSION: "18"
  CAPACITOR_WEB_DIR: "dist"

before_script:
  - echo "Setting up Node.js environment"
  - node --version
  - npm --version

build_mobile:
  stage: build
  image: node:18
  script:
    - echo "Installing dependencies..."
    - npm ci
    - echo "Building for mobile with custom script..."
    - npm run build:mobile
    - echo "Verifying dist directory exists..."
    - ls -la dist/
    - echo "Dist directory contents:"
    - find dist/ -type f | head -20
  artifacts:
    paths:
      - dist/
      - .next/
    expire_in: 1 hour
  only:
    - main
    - develop

# Alternative build command for CI/CD systems that don't recognize custom scripts
build_fallback:
  stage: build
  image: node:18
  script:
    - echo "Fallback build process"
    - npm ci
    - npm run build
    - node build-mobile.js
    - ls -la dist/
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  when: manual