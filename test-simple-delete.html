<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Simple Delete</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #1a1a1a;
            color: white;
            max-width: 800px;
            margin: 0 auto;
        }
        .campaign {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 20px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .delete-btn:hover {
            background: #b91c1c;
        }
        .delete-btn:active {
            background: #991b1b;
            transform: scale(0.98);
        }
        .log {
            background: #111;
            padding: 15px;
            margin: 15px 0;
            border-radius: 6px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
            font-size: 12px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-weight: bold;
        }
        .success { background: #065f46; color: #10b981; }
        .error { background: #7f1d1d; color: #f87171; }
        .info { background: #1e3a8a; color: #60a5fa; }
    </style>
</head>
<body>
    <h1>🧪 Test Simple de Eliminación</h1>
    
    <div id="status" class="status info">Cargando...</div>
    
    <div id="campaigns-list"></div>
    
    <div class="log" id="log"></div>
    
    <script>
        let campaigns = [];
        
        function log(message) {
            const logEl = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            logEl.textContent += `[${time}] ${message}\n`;
            logEl.scrollTop = logEl.scrollHeight;
            console.log(message);
        }
        
        function updateStatus(message, type = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
        }
        
        function renderCampaigns() {
            const container = document.getElementById('campaigns-list');
            container.innerHTML = '';
            
            if (campaigns.length === 0) {
                container.innerHTML = '<p style="color: #888;">No hay campañas disponibles</p>';
                return;
            }
            
            campaigns.forEach(campaign => {
                const div = document.createElement('div');
                div.className = 'campaign';
                div.innerHTML = `
                    <div>
                        <h3>${campaign.name}</h3>
                        <p style="color: #888; font-size: 12px;">ID: ${campaign.id}</p>
                    </div>
                    <button 
                        class="delete-btn" 
                        onclick="deleteCampaign('${campaign.id}', '${campaign.name}')"
                    >
                        Eliminar
                    </button>
                `;
                container.appendChild(div);
            });
        }
        
        async function loadCampaigns() {
            try {
                updateStatus('Cargando campañas...', 'info');
                log('Iniciando carga de campañas');
                
                const response = await fetch('/api/campaigns/automated', {
                    headers: {
                        'x-user-email': 'selamu.garcia@gmail.com'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                campaigns = data.campaigns || [];
                
                log(`Campañas cargadas: ${campaigns.length}`);
                updateStatus(`${campaigns.length} campañas cargadas`, 'success');
                
                renderCampaigns();
                
            } catch (error) {
                log(`Error: ${error.message}`);
                updateStatus(`Error: ${error.message}`, 'error');
            }
        }
        
        async function deleteCampaign(campaignId, campaignName) {
            log(`\n=== ELIMINANDO CAMPAÑA ===`);
            log(`ID: ${campaignId}`);
            log(`Nombre: ${campaignName}`);
            
            // Confirmar
            if (!confirm(`¿Eliminar "${campaignName}"?`)) {
                log('Eliminación cancelada');
                return;
            }
            
            try {
                updateStatus('Eliminando campaña...', 'info');
                log('Enviando solicitud DELETE...');
                
                const response = await fetch('/api/campaigns/automated', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-user-email': 'selamu.garcia@gmail.com'
                    },
                    body: JSON.stringify({ campaignId })
                });
                
                log(`Respuesta: ${response.status} ${response.statusText}`);
                
                if (response.ok) {
                    const result = await response.json();
                    log(`Resultado: ${JSON.stringify(result)}`);
                    
                    // Actualizar lista local
                    campaigns = campaigns.filter(c => c.id !== campaignId);
                    log(`Campañas restantes: ${campaigns.length}`);
                    
                    updateStatus('Campaña eliminada exitosamente', 'success');
                    renderCampaigns();
                    
                    // Recargar desde servidor para verificar
                    setTimeout(() => {
                        log('Verificando eliminación...');
                        loadCampaigns();
                    }, 1000);
                    
                } else {
                    const error = await response.json();
                    throw new Error(error.error || 'Error del servidor');
                }
                
            } catch (error) {
                log(`Error eliminando: ${error.message}`);
                updateStatus(`Error: ${error.message}`, 'error');
            }
            
            log(`=== FIN ELIMINACIÓN ===\n`);
        }
        
        // Inicializar
        log('Iniciando test simple de eliminación');
        loadCampaigns();
    </script>
</body>
</html>
