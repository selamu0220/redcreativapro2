<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Botón Eliminar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #1a1a1a;
            color: white;
        }
        .campaign-card {
            background: #111827;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 24px;
            margin: 16px 0;
        }
        .button-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
        }
        .delete-btn {
            padding: 8px;
            border: 1px solid #374151;
            border-radius: 6px;
            background: transparent;
            color: #f87171;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .delete-btn:hover {
            background: rgba(185, 28, 28, 0.2);
        }
        .log {
            background: #111;
            padding: 15px;
            margin: 15px 0;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            max-height: 500px;
            overflow-y: auto;
            font-size: 12px;
        }
        .test-section {
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        .status {
            padding: 8px 16px;
            border-radius: 4px;
            margin: 8px 0;
            font-weight: bold;
        }
        .status.success { background: #065f46; color: #10b981; }
        .status.error { background: #7f1d1d; color: #f87171; }
        .status.warning { background: #78350f; color: #f59e0b; }
    </style>
</head>
<body>
    <h1>🔍 Debug Completo del Botón Eliminar</h1>
    
    <div class="status" id="status">Iniciando diagnóstico...</div>
    
    <div class="test-section">
        <h2>📋 Campañas Disponibles</h2>
        <div id="campaigns-container">
            <p>Cargando campañas...</p>
        </div>
    </div>
    
    <div class="test-section">
        <h2>🧪 Tests de Eventos</h2>
        <button class="delete-btn" onclick="testClickEvent()" style="margin: 5px;">
            ❌ Test Click Básico
        </button>
        <button class="delete-btn" id="testAdvanced" style="margin: 5px;">
            ❌ Test Click Avanzado
        </button>
    </div>
    
    <div class="log" id="log"></div>
    
    <script>
        let campaignsData = [];
        let testResults = {
            loadCampaigns: false,
            basicClick: false,
            advancedClick: false,
            deleteRequest: false
        };
        
        function updateStatus() {
            const statusEl = document.getElementById('status');
            const passed = Object.values(testResults).filter(Boolean).length;
            const total = Object.keys(testResults).length;
            
            if (passed === total) {
                statusEl.className = 'status success';
                statusEl.textContent = `✅ Todos los tests pasaron (${passed}/${total})`;
            } else if (passed > 0) {
                statusEl.className = 'status warning';
                statusEl.textContent = `⚠️ Tests parciales (${passed}/${total})`;
            } else {
                statusEl.className = 'status error';
                statusEl.textContent = `❌ Tests fallaron (${passed}/${total})`;
            }
        }
        
        function log(message, type = 'info') {
            const logElement = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const prefix = type === 'error' ? '❌' : type === 'success' ? '✅' : type === 'warning' ? '⚠️' : 'ℹ️';
            logElement.textContent += `[${timestamp}] ${prefix} ${message}\n`;
            logElement.scrollTop = logElement.scrollHeight;
            console.log(`${prefix} ${message}`);
        }
        
        async function loadCampaigns() {
            try {
                log('Iniciando carga de campañas...', 'info');
                const response = await fetch('/api/campaigns/automated', {
                    headers: {
                        'x-user-email': 'selamu.garcia@gmail.com'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                campaignsData = data.campaigns || [];
                
                log(`Campañas cargadas: ${campaignsData.length}`, 'success');
                testResults.loadCampaigns = true;
                updateStatus();
                
                displayCampaigns();
                
            } catch (error) {
                log(`Error cargando campañas: ${error.message}`, 'error');
                document.getElementById('campaigns-container').innerHTML = `<p style="color: #f87171;">Error: ${error.message}</p>`;
            }
        }
        
        function displayCampaigns() {
            const container = document.getElementById('campaigns-container');
            
            if (campaignsData.length === 0) {
                container.innerHTML = '<p style="color: #f59e0b;">No hay campañas disponibles para probar</p>';
                return;
            }
            
            container.innerHTML = '';
            
            campaignsData.forEach((campaign, index) => {
                const campaignDiv = document.createElement('div');
                campaignDiv.className = 'campaign-card';
                campaignDiv.innerHTML = `
                    <h3 style="color: white; margin-bottom: 8px;">${campaign.name}</h3>
                    <p style="color: #9ca3af; font-size: 14px;">ID: ${campaign.id}</p>
                    <p style="color: #9ca3af; font-size: 14px;">Email: ${campaign.userEmail}</p>
                    <div class="button-container">
                        <button 
                            class="delete-btn" 
                            onclick="deleteCampaignTest('${campaign.id}', '${campaign.name}')"
                            title="Eliminar campaña"
                        >
                            ❌
                        </button>
                        <span style="color: #9ca3af; font-size: 12px;">← Click para eliminar</span>
                    </div>
                `;
                container.appendChild(campaignDiv);
            });
        }
        
        function testClickEvent() {
            log('Test de click básico ejecutado correctamente', 'success');
            testResults.basicClick = true;
            updateStatus();
        }
        
        async function deleteCampaignTest(campaignId, campaignName) {
            log(`🔥 INICIO deleteCampaignTest - ID: ${campaignId}, Nombre: ${campaignName}`, 'info');
            
            // Verificar que el evento se ejecutó
            log('✅ Evento onClick ejecutado correctamente', 'success');
            
            if (!confirm(`¿Eliminar la campaña "${campaignName}"?\n\nEsta acción no se puede deshacer.`)) {
                log('❌ Usuario canceló la eliminación', 'warning');
                return;
            }
            
            try {
                log('🚀 Enviando solicitud DELETE...', 'info');
                
                const requestData = {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-user-email': 'selamu.garcia@gmail.com'
                    },
                    body: JSON.stringify({ campaignId })
                };
                
                log(`📤 Request: ${JSON.stringify(requestData, null, 2)}`, 'info');
                
                const response = await fetch('/api/campaigns/automated', requestData);
                
                log(`📡 Response Status: ${response.status} ${response.statusText}`, 'info');
                
                const result = await response.json();
                log(`📥 Response Data: ${JSON.stringify(result, null, 2)}`, 'info');
                
                if (response.ok) {
                    log('✅ Campaña eliminada exitosamente', 'success');
                    testResults.deleteRequest = true;
                    updateStatus();
                    
                    // Recargar campañas
                    setTimeout(() => {
                        log('🔄 Recargando campañas...', 'info');
                        loadCampaigns();
                    }, 1000);
                    
                } else {
                    log(`❌ Error del servidor: ${result.error || 'Error desconocido'}`, 'error');
                }
                
            } catch (error) {
                log(`💥 Error en la solicitud: ${error.message}`, 'error');
            }
            
            log('🏁 FIN deleteCampaignTest', 'info');
        }
        
        // Configurar event listener para test avanzado
        document.addEventListener('DOMContentLoaded', function() {
            const testBtn = document.getElementById('testAdvanced');
            if (testBtn) {
                testBtn.addEventListener('click', function(e) {
                    log('Test de click avanzado ejecutado correctamente', 'success');
                    log(`Event target: ${e.target.tagName}`, 'info');
                    log(`Event type: ${e.type}`, 'info');
                    testResults.advancedClick = true;
                    updateStatus();
                });
            }
        });
        
        // Inicializar
        log('🚀 Iniciando diagnóstico completo del botón eliminar', 'info');
        log('📋 Cargando campañas para pruebas...', 'info');
        loadCampaigns();
    </script>
</body>
</html>
